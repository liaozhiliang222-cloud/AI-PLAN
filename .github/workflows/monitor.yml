name: Daily Market Monitor

on:
  schedule:
    # 每 6 小时一次（UTC 02/08/14/20，北京时间 10/16/22/04）。
    # 主采集已由 Cloudflare Workers 原生 cron 承担（UTC 01/07/13/19，见 wrangler.jsonc），
    # 这里错开 1 小时：既是备份采集，也负责跑 LLM 分析（页面更新信号 + 媒体 RSS 条目筛选）。
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check sources & sample prices
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://aiplan.surveykit.cc' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_TOKEN:-}" ]; then
            echo "::error::缺少 Secret CRON_TOKEN（应为 sha256('apr-admin:<ADMIN_PASSWORD>') 的 hex 值）"
            exit 1
          fi

          # 分批检查监控源：Workers 单次请求抓完所有页面会超时，
          # 因此每批 4 个源、最多 6 轮；重复调用安全（增量，只查未检查过的）
          total_changed=0; total_checked=0
          for round in 1 2 3 4 5 6; do
            url="${SITE_URL%/}/api/cron?token=${CRON_TOKEN}&sources=1&limit=4"
            echo "== 第 ${round} 轮：${SITE_URL%/}/api/cron?token=***&sources=1&limit=4 =="
            http_code=$(curl -sS -o body.json -w '%{http_code}' --max-time 180 "$url" || echo "000")
            echo "HTTP ${http_code}"
            if [ "$http_code" != "200" ]; then
              echo "::error::监控请求返回非 200（${http_code}）"
              head -c 500 body.json || true
              exit 1
            fi

            summary=$(node -e '
              const r = JSON.parse(require("fs").readFileSync("body.json", "utf8"));
              console.log([r.checkedCount ?? 0, r.changed ?? 0, r.remainingUnchecked ?? 0].join(" "));
            ')
            checked=$(echo "$summary" | cut -d" " -f1)
            changed=$(echo "$summary" | cut -d" " -f2)
            remaining=$(echo "$summary" | cut -d" " -f3)
            echo "本批检查 ${checked} 个，变化 ${changed} 个，剩余未检查 ${remaining} 个"
            total_checked=$((total_checked + checked))
            total_changed=$((total_changed + changed))

            if [ "$remaining" = "0" ]; then
              echo "全部监控源本轮已检查完毕"
              break
            fi
          done

          echo "== 监控源汇总：共检查 ${total_checked} 项，变化 ${total_changed} 项 =="

          # 价格采样 + 异常检测（幂等，每天只补一次）
          url="${SITE_URL%/}/api/cron?token=${CRON_TOKEN}"
          echo "== 价格采样：/api/cron?token=*** =="
          http_code=$(curl -sS -o body2.json -w '%{http_code}' --max-time 120 "$url" || echo "000")
          if [ "$http_code" != "200" ]; then
            echo "::error::价格采样返回非 200（${http_code}）"
            head -c 500 body2.json || true
            exit 1
          fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync("body2.json", "utf8"));
            console.log("价格采样新增:", r.sampled ?? "-", "条");
            console.log("价格异常:", r.anomalies ?? "-", "条");
          '

          # 媒体 RSS 采集（拉取 + 关键词预筛 + 入待审队列，Workers 侧无 LLM 调用）
          url="${SITE_URL%/}/api/cron?token=${CRON_TOKEN}&rss=1"
          echo "== RSS 采集：/api/cron?token=***&rss=1 =="
          http_code=$(curl -sS -o body3.json -w '%{http_code}' --max-time 180 "$url" || echo "000")
          if [ "$http_code" != "200" ]; then
            echo "::warning::RSS 采集返回非 200（${http_code}），跳过"
          else
            node -e '
              const r = JSON.parse(require("fs").readFileSync("body3.json", "utf8"));
              console.log("RSS 源:", r.rss?.feeds ?? "-", "个，新入待审:", r.rss?.inserted ?? "-", "条");
            '
          fi

      - name: Analyze page updates with LLM
        # 把「页面更新」原始信号交给 LLM 解析：
        # 有实质变化（价格/额度/档位）→ 升级为具体资讯进入资讯流；
        # SPA 空壳 / 无实质变化 → 自动删除，不上页面
        run: node scripts/analyze-updates.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODELS: ${{ secrets.LLM_MODELS }}

      - name: Filter media RSS entries with LLM
        # 媒体条目二道筛：含具体事实 → 改写发布；纯观点/软文/盘点 → 删除；失败 → 保留重试
        run: node scripts/analyze-rss.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODELS: ${{ secrets.LLM_MODELS }}

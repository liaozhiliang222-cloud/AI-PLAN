name: Daily Model Sync

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）同步模型排行榜
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync models from artificialanalysis.ai
        run: |
          curl -s -X GET "https://plan.surveykit.cc/api/cron?token=${CRON_TOKEN}&models=1&sources=1"
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
